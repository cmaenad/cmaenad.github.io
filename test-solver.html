<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Test Solver</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:20px;font-size:13px;}.ok{color:#4f4}.err{color:#f44;font-weight:bold}.info{color:#fa4}</style>
</head>
<body>
<h2>Test Solver</h2>
<div id="out"></div>
<script type="module">
const out = document.getElementById('out');
function log(msg, ok) {
  const d = document.createElement('div');
  d.className = ok===undefined?'info':(ok?'ok':'err');
  d.textContent = (ok===true?'✓ ':ok===false?'✗ ':'ℹ ') + msg;
  out.appendChild(d);
  console.log(d.textContent);
}

log('Script iniciado');

try {
  const mod = await import('./js/cube.js?v=6');
  log('cube.js importado OK');
  const { Cube } = mod;

  const c = new Cube();
  log('Cube creado, isSolved: ' + c.isSolved(), c.isSolved());

  c.move('U');
  log('Tras U, isSolved: ' + c.isSolved(), !c.isSolved());
  log('Estado U: ' + c.state.map((f,i)=>'UDFBLR'[i]+':'+f.join('')).join(' '));

  // Test solver via Worker
  log('Iniciando Worker...');
  const worker = new Worker('./js/solver-worker.js');
  
  worker.onerror = (e) => {
    log('Worker ERROR: ' + e.message + ' (line ' + e.lineno + ')', false);
  };
  
  worker.onmessage = (e) => {
    log('Worker respondió: ' + JSON.stringify(e.data));
    if (e.data.error) {
      log('Error en solver: ' + e.data.error, false);
      if (e.data.stack) log('Stack: ' + e.data.stack);
    } else {
      const moves = e.data.moves;
      log('Movimientos encontrados: ' + moves.length + ' → ' + moves.join(' '), moves.length > 0);
      // Verificar
      const c2 = new Cube();
      c2.move('U');
      c2.applyMoves(moves);
      log('Tras aplicar solución, isSolved: ' + c2.isSolved(), c2.isSolved());
    }
    worker.terminate();
  };

  const state = c.serialize();
  log('Enviando estado al worker: ' + state);
  worker.postMessage({ state });

} catch(e) {
  log('ERROR: ' + e.message, false);
  log('Stack: ' + e.stack);
}
</script>
</body>
</html>
