<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Test Solver</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;font-size:13px;}
.ok{color:#4f4}.err{color:#f44;font-weight:bold}.warn{color:#fa4}
pre{background:#1a1a1a;padding:6px;border-radius:4px;margin:2px 0;font-size:11px;}
</style>
</head>
<body>
<h2>Test Solver</h2>
<div id="out"></div>
<script type="module">
import { Cube } from './js/cube.js?v=5';

const out = document.getElementById('out');
let pass=0,fail=0;

function log(label,ok,extra=''){
  const d=document.createElement('div');
  d.className=ok?'ok':'err';
  d.textContent=(ok?'✓ ':'✗ ')+label+(extra?' → '+extra:'');
  out.appendChild(d);
  ok?pass++:fail++;
}
function info(msg){
  const d=document.createElement('div');
  d.className='warn';
  d.textContent='ℹ '+msg;
  out.appendChild(d);
}
function showState(label,cube){
  const p=document.createElement('pre');
  p.textContent=label+'\n'+cube.state.map((f,i)=>'UDFBLR'[i]+': '+f.join(' ')).join('\n');
  out.appendChild(p);
}

// ── Inline solver para testear sin worker ────────────────────────
const FACE_CW  = [6,3,0,7,4,1,8,5,2];
const FACE_CCW = [2,5,8,1,4,7,0,3,6];
const S = (f,i) => f*9+i;
const CYCLES = {
  U:[[S(2,0),S(5,0),S(3,0),S(4,0)],[S(2,1),S(5,1),S(3,1),S(4,1)],[S(2,2),S(5,2),S(3,2),S(4,2)]],
  D:[[S(2,6),S(4,6),S(3,6),S(5,6)],[S(2,7),S(4,7),S(3,7),S(5,7)],[S(2,8),S(4,8),S(3,8),S(5,8)]],
  F:[[S(0,6),S(5,0),S(1,2),S(4,8)],[S(0,7),S(5,3),S(1,1),S(4,5)],[S(0,8),S(5,6),S(1,0),S(4,2)]],
  B:[[S(0,2),S(4,0),S(1,6),S(5,8)],[S(0,1),S(4,3),S(1,7),S(5,5)],[S(0,0),S(4,6),S(1,8),S(5,2)]],
  L:[[S(0,0),S(2,0),S(1,0),S(3,8)],[S(0,3),S(2,3),S(1,3),S(3,5)],[S(0,6),S(2,6),S(1,6),S(3,2)]],
  R:[[S(0,2),S(2,2),S(1,2),S(3,6)],[S(0,5),S(2,5),S(1,5),S(3,3)],[S(0,8),S(2,8),S(1,8),S(3,0)]],
};
const FI={U:0,D:1,F:2,B:3,L:4,R:5};

class CW {
  constructor(){this.s=Array.from({length:6},(_,i)=>Array(9).fill(i));}
  clone(){const c=new CW();c.s=this.s.map(f=>[...f]);return c;}
  _apply(fi,cyc,cw){
    const flat=this.s.flat(),next=[...flat];
    const base=fi*9,rot=cw?FACE_CW:FACE_CCW;
    for(let i=0;i<9;i++) next[base+i]=flat[base+rot[i]];
    for(const[a,b,c,d]of cyc){
      if(cw){next[b]=flat[a];next[c]=flat[b];next[d]=flat[c];next[a]=flat[d];}
      else  {next[d]=flat[a];next[c]=flat[d];next[b]=flat[c];next[a]=flat[b];}
    }
    for(let f=0;f<6;f++) for(let i=0;i<9;i++) this.s[f][i]=next[f*9+i];
  }
  move(n){const f=n[0],mod=n.slice(1),cw=!mod.includes("'"),t=mod.includes('2')?2:1;for(let i=0;i<t;i++)this._apply(FI[f],CYCLES[f],cw);}
  applyMoves(ms){ms.forEach(m=>this.move(m));}
  key(){return this.s.map(f=>f.join('')).join('|');}
  isSolved(){return this.s.every(f=>f.every(v=>v===f[4]));}
  fromCube(cube){this.s=cube.state.map(f=>[...f]);}
}

const ALL=['U',"U'","U2",'D',"D'","D2",'F',"F'","F2",'B',"B'","B2",'L',"L'","L2",'R',"R'","R2"];
const NO_U=ALL.filter(m=>m[0]!=='U');
const NO_UD=ALL.filter(m=>m[0]!=='U'&&m[0]!=='D');

function bfs(state,goalFn,maxDepth,moves,maxNodes=200000){
  if(goalFn(state)) return [];
  const queue=[{s:state.clone(),path:[]}];
  const seen=new Set([state.key()]);
  let n=0;
  while(queue.length&&n<maxNodes){
    const{s,path}=queue.shift();n++;
    if(path.length>=maxDepth) continue;
    for(const m of moves){
      const ns=s.clone();ns.move(m);
      const k=ns.key();
      if(seen.has(k)) continue;
      seen.add(k);
      const np=[...path,m];
      if(goalFn(ns)) return np;
      queue.push({s:ns,path:np});
    }
  }
  return null;
}

// Objetivos independientes (sin encadenamiento)
const crossDone=w=>
  w.s[0][1]===w.s[0][4]&&w.s[0][3]===w.s[0][4]&&w.s[0][5]===w.s[0][4]&&w.s[0][7]===w.s[0][4]&&
  w.s[2][1]===w.s[2][4]&&w.s[3][1]===w.s[3][4]&&w.s[4][1]===w.s[4][4]&&w.s[5][1]===w.s[5][4];

const topDone=w=>w.s[0].every(v=>v===w.s[0][4])&&
  [0,1,2].every(i=>w.s[2][i]===w.s[2][4]&&w.s[3][i]===w.s[3][4]&&w.s[4][i]===w.s[4][4]&&w.s[5][i]===w.s[5][4]);

const midDone=w=>topDone(w)&&
  [3,5].every(i=>[2,3,4,5].every(f=>w.s[f][i]===w.s[f][4]));

const botCross=w=>midDone(w)&&[1,3,5,7].every(i=>w.s[1][i]===w.s[1][4]);

const botEdges=w=>botCross(w)&&[2,3,4,5].every(f=>w.s[f][7]===w.s[f][4]);

const botCorners=w=>botEdges(w)&&[0,2,6,8].every(i=>w.s[1][i]===w.s[1][4]);

function solve(cube){
  const w=new CW(); w.fromCube(cube);
  if(w.isSolved()) return [];
  const sol=[];
  const phases=[
    ['Cruz U',    crossDone,  ALL,   7],
    ['Capa U',    topDone,    ALL,   7],
    ['Capa mid',  midDone,    NO_U,  7],
    ['Cruz D',    botCross,   NO_UD, 7],
    ['Aristas D', botEdges,   NO_UD, 7],
    ['Esquinas D',botCorners, NO_UD, 7],
    ['Final',     c=>c.isSolved(), NO_UD, 8],
  ];
  for(const[name,goal,moves,depth]of phases){
    if(goal(w)){info(`Fase "${name}": ya completa`);continue;}
    const t0=performance.now();
    const found=bfs(w,goal,depth,moves);
    const dt=Math.round(performance.now()-t0);
    if(found){
      info(`Fase "${name}": ${found.length} movs en ${dt}ms → ${found.join(' ')}`);
      sol.push(...found);w.applyMoves(found);
    } else {
      info(`Fase "${name}": BFS no encontró solución en ${dt}ms (depth=${depth})`);
    }
    if(w.isSolved()) break;
  }
  return sol;
}

// ── Tests ─────────────────────────────────────────────────────────

// Test 1: cubo ya resuelto
{
  const c=new Cube();
  const w=new CW(); w.fromCube(c);
  log('Cubo resuelto → isSolved()',w.isSolved());
  const moves=solve(c);
  log('Cubo resuelto → solve() devuelve []',moves.length===0,'moves='+moves.length);
}

// Test 2: un solo movimiento U
{
  const c=new Cube(); c.move('U');
  info('--- Resolver tras U ---');
  const moves=solve(c);
  log('Tras U: solve() encuentra solución',moves.length>0,'moves='+moves.join(' '));
  if(moves.length>0){
    const c2=new Cube(); c2.move('U'); c2.applyMoves(moves);
    log('Tras U + solución: isSolved()',c2.isSolved());
    showState('Estado final:',c2);
  }
}

// Test 3: sexy move ×1
{
  const c=new Cube(); c.applyMoves(["R","U","R'","U'"]);
  info('--- Resolver tras R U R\' U\' ---');
  const moves=solve(c);
  log('Solve encuentra solución',moves.length>0,'moves='+moves.join(' '));
  if(moves.length>0){
    const c2=new Cube(); c2.applyMoves(["R","U","R'","U'"]); c2.applyMoves(moves);
    log('Estado final isSolved',c2.isSolved());
  }
}

// Test 4: mezcla de 5 movimientos
{
  const scramble=["R","U","F","L","D"];
  const c=new Cube(); c.applyMoves(scramble);
  info('--- Resolver tras '+scramble.join(' ')+' ---');
  const moves=solve(c);
  log('Solve encuentra solución',moves.length>0,'moves='+moves.join(' '));
  if(moves.length>0){
    const c2=new Cube(); c2.applyMoves(scramble); c2.applyMoves(moves);
    log('Estado final isSolved',c2.isSolved());
    showState('Estado final:',c2);
  }
}

// Test 5: mezcla de 10 movimientos
{
  const scramble=["R","U","R'","F","D","L","B","U'","R2","F'"];
  const c=new Cube(); c.applyMoves(scramble);
  info('--- Resolver tras 10 movs ---');
  const moves=solve(c);
  log('Solve 10 movs: encuentra solución',moves.length>0,'moves='+moves.join(' '));
  if(moves.length>0){
    const c2=new Cube(); c2.applyMoves(scramble); c2.applyMoves(moves);
    log('Estado final isSolved',c2.isSolved());
  }
}

// Test 6: verificar que crossDone detecta cruz correctamente
{
  const c=new Cube();
  const w=new CW(); w.fromCube(c);
  log('crossDone en cubo resuelto',crossDone(w));
  log('topDone en cubo resuelto',topDone(w));
  log('midDone en cubo resuelto',midDone(w));
  log('botCross en cubo resuelto',botCross(w));
  log('botEdges en cubo resuelto',botEdges(w));
  log('botCorners en cubo resuelto',botCorners(w));
}

// Test 7: crossDone tras U (cruz U debería seguir ok, solo rotó)
{
  const c=new Cube(); c.move('U');
  const w=new CW(); w.fromCube(c);
  // Tras U, las aristas de U siguen siendo color U pero las laterales cambiaron
  info('crossDone tras U: '+(crossDone(w)?'true (correcto si aristas lat alineadas)':'false'));
}

const h=document.createElement('h3');
h.textContent=`Resultado: ${pass} OK, ${fail} FALLOS`;
h.style.color=fail===0?'#4f4':'#f44';
out.appendChild(h);
</script>
</body>
</html>
