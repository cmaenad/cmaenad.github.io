<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Test Motor Cubo</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;font-size:13px;}
.ok{color:#4f4}.err{color:#f44;font-weight:bold}.sec{color:#88f;font-size:14px;margin-top:10px;display:block}
pre{background:#1a1a1a;padding:4px 8px;border-radius:4px;margin:2px 0;font-size:11px;}
</style>
</head>
<body>
<h2>Test Motor Cubo — versión simplificada</h2>
<div id="out"></div>
<script type="module">
import { Cube, invertMoves } from './js/cube.js?v=15';
const out = document.getElementById('out');
let pass=0, fail=0;

function sec(t){const d=document.createElement('span');d.className='sec';d.textContent='── '+t+' ──';out.appendChild(d);}
function log(label,ok,extra=''){
  const d=document.createElement('div');d.className=ok?'ok':'err';
  d.textContent=(ok?'✓ ':'✗ ')+label+(extra?' ['+extra+']':'');
  out.appendChild(d);ok?pass++:fail++;
}
function state(c){
  const p=document.createElement('pre');
  p.textContent=c.state.map((f,i)=>'UDFBLR'[i]+': '+f.join(' ')).join('\n');
  out.appendChild(p);
}

const row=(c,f,r)=>[c.state[f][r*3],c.state[f][r*3+1],c.state[f][r*3+2]];
const col=(c,f,n)=>[c.state[f][n],c.state[f][n+3],c.state[f][n+6]];
const eq=(arr,v)=>arr.every(x=>x===v);

// ── 1. Identidades ────────────────────────────────────────────────
sec('X×4 = identidad');
['U','D','F','B','L','R'].forEach(m=>{
  const c=new Cube();for(let i=0;i<4;i++)c.move(m);
  log(m+'×4',c.isSolved());
});

sec('X X\' = identidad');
['U','D','F','B','L','R'].forEach(m=>{
  const c=new Cube();c.move(m);c.move(m+"'");
  log(m+' '+m+"'",c.isSolved());
});

sec('X2 X2 = identidad');
['U','D','F','B','L','R'].forEach(m=>{
  const c=new Cube();c.move(m+'2');c.move(m+'2');
  log(m+'2 '+m+'2',c.isSolved());
});

// ── 2. Dirección de cada movimiento ──────────────────────────────
sec('Dirección horaria de cada movimiento');
{
  const c=new Cube();c.move('U');
  log('U: F→R (fila sup)',eq(row(c,5,0),2),'R top='+row(c,5,0));
  log('U: R→B',eq(row(c,3,0),5),'B top='+row(c,3,0));
  log('U: B→L',eq(row(c,4,0),3),'L top='+row(c,4,0));
  log('U: L→F',eq(row(c,2,0),4),'F top='+row(c,2,0));
}
{
  const c=new Cube();c.move('D');
  log('D: F→L (fila inf)',eq(row(c,4,2),2),'L bot='+row(c,4,2));
  log('D: L→B',eq(row(c,3,2),4),'B bot='+row(c,3,2));
  log('D: B→R',eq(row(c,5,2),3),'R bot='+row(c,5,2));
  log('D: R→F',eq(row(c,2,2),5),'F bot='+row(c,2,2));
}
{
  const c=new Cube();c.move('F');
  log('F: U-bot→R-left',eq(col(c,5,0),0),'R left='+col(c,5,0));
  log('F: R-left→D-top',eq(row(c,1,0),5),'D top='+row(c,1,0));
  log('F: D-top→L-right',eq(col(c,4,2),1),'L right='+col(c,4,2));
  log('F: L-right→U-bot',eq(row(c,0,2),4),'U bot='+row(c,0,2));
}
{
  const c=new Cube();c.move('B');
  log('B: U-top→L-left',eq(col(c,4,0),0),'L left='+col(c,4,0));
  log('B: L-left→D-bot',eq(row(c,1,2),4),'D bot='+row(c,1,2));
  log('B: D-bot→R-right',eq(col(c,5,2),1),'R right='+col(c,5,2));
  log('B: R-right→U-top',eq(row(c,0,0),5),'U top='+row(c,0,0));
}
{
  const c=new Cube();c.move('L');
  log('L: U-left→F-left',eq(col(c,2,0),0),'F left='+col(c,2,0));
  log('L: F-left→D-left',eq(col(c,1,0),2),'D left='+col(c,1,0));
  log('L: D-left→B-right',eq(col(c,3,2),1),'B right='+col(c,3,2));
  log('L: B-right→U-left',eq(col(c,0,0),3),'U left='+col(c,0,0));
}
{
  const c=new Cube();c.move('R');
  log('R: U-right→F-right',eq(col(c,2,2),0),'F right='+col(c,2,2));
  log('R: F-right→D-right',eq(col(c,1,2),2),'D right='+col(c,1,2));
  log('R: D-right→B-left',eq(col(c,3,0),1),'B left='+col(c,3,0));
  log('R: B-left→U-right',eq(col(c,0,2),3),'U right='+col(c,0,2));
}

// ── 3. Conservación de stickers ───────────────────────────────────
sec('9×cada color tras cualquier movimiento');
['U',"U'","U2",'D',"D'","D2",'F',"F'","F2",'B',"B'","B2",'L',"L'","L2",'R',"R'","R2"].forEach(m=>{
  const c=new Cube();c.move(m);
  const cnt=Array(6).fill(0);c.state.flat().forEach(v=>cnt[v]++);
  log(m,cnt.every(n=>n===9),cnt.every(n=>n===9)?'':cnt.join(','));
});

// ── 4. Algoritmos con orden conocido ─────────────────────────────
sec('Algoritmos con orden conocido');
{
  // Sexy move: orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(['R','U',"R'","U'"]);
  log('(R U R\' U\')×6',c.isSolved());
}
{
  // Sune: orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(['R','U',"R'","U",'R',"U2","R'"]);
  log('Sune×6',c.isSolved());
}
{
  // F R U R' U' F': orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(['F','R','U',"R'","U'","F'"]);
  log('(F R U R\' U\' F\')×6',c.isSolved());
}
{
  // R2 F2: orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(['R2','F2']);
  log('(R2 F2)×6',c.isSolved());
}
{
  // F R F' R': orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(['F','R',"F'","R'"]);
  log('(F R F\' R\')×6',c.isSolved());
}
{
  // R' F R F': orden 6
  const c=new Cube();for(let i=0;i<6;i++)c.applyMoves(["R'","F","R","F'"]);
  log("(R' F R F')×6",c.isSolved());
}
{
  // T-perm: buscar orden hasta 60
  const tp=['R','U',"R'","U'","R'","F","R2","U'","R'","U'","R","U","R'","F'"];
  const c=new Cube();
  let found=false;
  for(let i=1;i<=60;i++){c.applyMoves(tp);if(c.isSolved()){log('T-perm orden='+i,i===2,'orden esperado 2, obtenido '+i);found=true;break;}}
  if(!found)log('T-perm: no vuelve en 60 aplicaciones',false);
}
{
  // Niklas: orden 3
  const nk=["R","U2","R'","U'","R","U2","L'","U","R'","U'","L"];
  const c=new Cube();
  let found=false;
  for(let i=1;i<=12;i++){c.applyMoves(nk);if(c.isSolved()){log('Niklas orden='+i,true);found=true;break;}}
  if(!found)log('Niklas: no vuelve a identidad en 12 aplicaciones',false,
    'estado='+c.state.map((f,i)=>'UDFBLR'[i]+':'+f.join('')).join(' '));
}

// ── 5. Invertir mezcla ────────────────────────────────────────────
sec('Mezcla + inversa = identidad');
[
  ['R','U',"R'","F","D","L","B","U'","R2","F'"],
  ['F2','L',"B'","U","R","D2","F","L'","B","U2"],
  ['R','U','R2',"F'","U","L","U'","L'","F","R2","U'","R'"],
  ['R','U',"R'","U'","R'","F","R2","U'","R'","U'","R","U","R'","F'"],
].forEach(sc=>{
  const c=new Cube();c.applyMoves(sc);
  c.applyMoves(invertMoves(sc));
  log(sc.slice(0,4).join(' ')+'...',c.isSolved());
});

// ── Resumen ───────────────────────────────────────────────────────
const h=document.createElement('h3');
h.textContent=`Resultado: ${pass} OK, ${fail} FALLOS`;
h.style.color=fail===0?'#4f4':'#f44';
out.appendChild(h);
</script>
</body>
</html>
